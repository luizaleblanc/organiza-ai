name: KOF check

# Compila/valida o frontend KOF (frontend/) em toda mudança que toque .kf,
# para nenhum código KOF quebrado chegar a main.
# Ver: DESIGN_SYSTEM.md, PROJECT_STATUS.md, KOF_REFERENCE.md.

on:
  push:
    paths:
      - "frontend/**/*.kf"
      - "bff/**/*.kf"
      - ".github/workflows/kof-check.yml"
  pull_request:
    paths:
      - "frontend/**/*.kf"
      - "bff/**/*.kf"
      - ".github/workflows/kof-check.yml"

jobs:
  kof-check:
    runs-on: ubuntu-latest
    env:
      KOF_VERSION: 0.3.1-beta
    steps:
      - uses: actions/checkout@v4

      - name: Baixar e instalar o Kof CLI (release oficial linux-x86_64)
        run: |
          curl -fsSL -o kof.tar.gz \
            "https://github.com/KofLang/Kof4j/releases/download/kof-${KOF_VERSION}-linux-x86_64/kof-${KOF_VERSION}-linux-x86_64.tar.gz"
          tar -xzf kof.tar.gz
          DIR=$(find . -maxdepth 1 -type d -name "kof-*-linux-x86_64" | head -1)
          echo "$DIR/bin" >> "$GITHUB_PATH"

      - name: kof version / info
        run: |
          kof version
          kof info

      - name: kof check — frontend (KOF UI, monolito modular)
        run: kof check frontend

      - name: kof check — BFF (KOF web)
        if: always()
        run: |
          if [ -d bff ] && find bff -name "*.kf" | grep -q .; then
            kof check bff
          else
            echo "bff/ ainda sem arquivos .kf — pulando"
          fi
