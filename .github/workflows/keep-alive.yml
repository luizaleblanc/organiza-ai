name: Keep backend alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (backend Kof)
        run: |
          curl -fsS --max-time 90 -o /dev/null -w "HTTP %{http_code}\n" https://organiza-ai-5qzv.onrender.com/health
