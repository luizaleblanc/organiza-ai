spring.datasource.url=jdbc:h2:mem:budgeting;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.docker.compose.enabled=false

spring.ai.openai.api-key=test-key
spring.ai.openai.base-url=https://generativelanguage.googleapis.com
spring.ai.openai.chat.completions-path=/v1beta/openai/chat/completions
spring.ai.openai.chat.options.model=gemini-2.5-flash-lite
spring.ai.openai.chat.options.temperature=0.7
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
gemini.api-key=test-key
gemini.audio.model=gemini-2.5-flash-lite
gemini.speech.model=gemini-2.5-flash-preview-tts
gemini.speech.voice=Kore

api.security.token.secret=chave-de-teste-usada-apenas-em-testes-automatizados
