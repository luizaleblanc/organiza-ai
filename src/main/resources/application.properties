spring.application.name=budgeting
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/transaction?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health
management.health.redis.enabled=false

# Spring AI / Gemini Configuration
spring.ai.openai.api-key=${GEMINI_API_KEY:${OPENAI_API_KEY:}}
spring.ai.openai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
spring.ai.openai.chat.options.model=${AI_MODEL:gemini-2.0-flash}
spring.ai.openai.chat.options.temperature=0.7

# Gemini Native Audio Service
gemini.api-key=${GEMINI_API_KEY:${OPENAI_API_KEY:}}
gemini.audio.model=${GEMINI_AUDIO_MODEL:gemini-2.5-flash-lite}
gemini.speech.model=${GEMINI_SPEECH_MODEL:gemini-2.5-flash-preview-tts}
gemini.speech.voice=${GEMINI_SPEECH_VOICE:Kore}

spring.ai.retry.max-attempts=5
spring.ai.retry.backoff.initial-interval=1000
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=8000

api.security.token.secret=${API_SECURITY_TOKEN_SECRET:minha-chave-jwt-super-secreta-organiza-ai-2026-forte}

logging.level.org.springframework.ai=INFO
